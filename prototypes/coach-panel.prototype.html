<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英语带教独立悬浮窗 · 界面原型</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; color: #263942; background: #e7edef; }
    * { box-sizing: border-box; }
    button, textarea { font: inherit; }
    button { cursor: pointer; }
    .page { max-width: 1390px; margin: auto; padding: 28px 28px 48px; }
    h1 { font-size: 22px; letter-spacing: -.03em; margin: 0 0 6px; }
    .lead { color: #60757b; font-size: 13px; line-height: 1.5; margin: 0 0 16px; }
    .controls { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 13px; }
    .controls button { border: 1px solid #c6d2d5; border-radius: 9px; background: #f9fbfb; color: #496168; padding: 8px 11px; font-size: 12px; }
    .controls button:hover { border-color: #6aa99c; background: white; }
    .scene { position: relative; height: 710px; max-height: calc(100vh - 175px); min-height: 560px; overflow: hidden; border: 1px solid #b8c5c9; border-radius: 15px; background: linear-gradient(145deg, #dce9eb, #d2dfe2); box-shadow: 0 20px 60px #30525826; }
    .menubar { height: 34px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: #edf3f3d9; border-bottom: 1px solid #c9d7d9; color: #48616a; font-size: 12px; }
    .window { position: absolute; background: #fff; border: 1px solid #c3d1d3; border-radius: 12px; box-shadow: 0 15px 40px #304c5540; overflow: hidden; }
    .window-bar { height: 37px; background: #f0f4f5; border-bottom: 1px solid #dce4e6; display: flex; align-items: center; justify-content: center; color: #6b7f85; font-size: 11px; }
    .lights { position: absolute; left: 13px; display: flex; gap: 6px; }
    .lights i { width: 9px; height: 9px; border-radius: 50%; background: #f17c76; }
    .lights i:nth-child(2) { background: #eac361; }
    .lights i:nth-child(3) { background: #67c883; }
    .calendar { z-index: 1; width: 330px; height: 285px; right: 46px; top: 74px; }
    .calendar .body { padding: 22px; color: #72878e; font-size: 12px; line-height: 1.8; }
    .calendar strong { display: block; color: #3b5861; font-size: 15px; margin-bottom: 10px; }
    .calendar .line { height: 9px; width: 75%; margin-top: 11px; border-radius: 5px; background: #e5eeee; }
    .calendar .line.short { width: 52%; }
    .notes { z-index: 2; left: 47px; top: 72px; width: min(850px, calc(100% - 430px)); height: 570px; }
    .notes .body { padding: 29px 37px; }
    .notes h2 { margin: 0 0 8px; font-size: 22px; }
    .notes p { color: #7c8f95; font-size: 12px; line-height: 1.6; max-width: 620px; }
    #editor { display: block; width: 100%; height: 185px; margin-top: 28px; padding: 17px; border: 1px solid #d6e0e2; border-radius: 10px; outline: none; resize: vertical; background: #fbfdfd; color: #30454b; font-size: 15px; line-height: 1.6; }
    #editor:focus { border-color: #50a599; box-shadow: 0 0 0 3px #50a59922; }
    .delivery { margin-top: 14px; font-size: 12px; color: #628079; }
    .delivery b { color: #2d8a74; }
    .voicebar { position: absolute; z-index: 3; bottom: 18px; left: 50%; transform: translateX(-50%); border-radius: 999px; background: #263f46; color: #edf8f5; padding: 10px 17px; box-shadow: 0 8px 25px #21434e50; font-size: 11px; white-space: nowrap; }
    #coach { position: absolute; inset: 34px 0 0; z-index: 5; pointer-events: none; }
    #coach button, #coach .coach-window, #coach .coach-pill { pointer-events: auto; }
    .coach-window { position: absolute; right: 28px; bottom: 66px; width: 363px; max-height: calc(100% - 88px); overflow: auto; padding: 17px; background: #fff; border: 1px solid #ccdcdb; border-radius: 15px; box-shadow: 0 17px 50px #24454f52; }
    .coach-pill { position: absolute; right: 28px; bottom: 74px; border: 0; border-radius: 999px; background: #244b4b; color: white; padding: 11px 15px; box-shadow: 0 10px 28px #24454f52; font-size: 12px; }
    .coach-pill .spot { display: inline-block; width: 7px; height: 7px; margin-right: 9px; border-radius: 50%; background: #7ce0c0; }
    .coach-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .eyebrow { color: #338b7b; font-size: 10px; font-weight: 700; letter-spacing: .06em; }
    .coach-head h3 { margin: 5px 0 0; font-size: 16px; }
    .head-actions { display: flex; gap: 6px; }
    .icon-button { border: 0; background: #f2f7f6; color: #607a7e; width: 25px; height: 25px; border-radius: 7px; font-size: 17px; line-height: 1; }
    .description { color: #698087; font-size: 12px; line-height: 1.5; margin: 13px 0 0; }
    .segment-tabs { display: flex; gap: 6px; margin-top: 14px; }
    .segment-tabs button { padding: 6px 9px; border-radius: 7px; border: 1px solid #dbe8e5; background: #f7faf9; color: #688080; font-size: 11px; }
    .segment-tabs button.selected { background: #e6f4ef; color: #2e786d; font-weight: 700; }
    .sample { margin-top: 14px; padding: 11px; border: 1px solid #e3ecea; border-radius: 9px; background: #f7faf9; }
    .sample small { display: block; margin-bottom: 6px; color: #83969a; font-size: 10px; }
    .sample .raw { color: #8f7775; text-decoration: line-through; font-size: 12px; }
    .sample .natural { margin-top: 5px; color: #2d7068; font-weight: 650; font-size: 13px; }
    .advice { margin-top: 14px; display: grid; gap: 8px; }
    .advice p { margin: 0; color: #586f75; font-size: 12px; line-height: 1.5; }
    .advice strong { color: #36535a; }
    .note { margin-top: 12px; padding: 10px; background: #f3f7f8; border-radius: 8px; color: #647c83; font-size: 11px; line-height: 1.5; }
    .readout { color: #697f85; font-size: 11px; margin-top: 12px; }
    @media (max-width: 900px) { .notes { width: calc(100% - 90px); } .calendar { display: none; } .coach-window { right: 14px; } }
    @media (max-width: 620px) { .page { padding: 13px; } .scene { min-height: 630px; } .notes { left: 16px; top: 55px; width: calc(100% - 32px); } .notes .body { padding: 20px; } .coach-window { width: calc(100% - 28px); bottom: 54px; } .coach-pill { right: 14px; bottom: 64px; } }
  </style>
</head>
<body>
  <main class="page">
    <h1>英语带教：一个独立悬浮窗</h1>
    <p class="lead">背景是两个普通 App 窗口。右下角的带教窗浮在桌面上，不属于其中任何一个 App；小圆条只是它收起后的状态。下方按钮只模拟带教状态，不是不同布局方案，也不模拟向输入框上屏。</p>
    <div class="controls" aria-label="原型场景">
      <button data-scene="ready">建议到达</button>
      <button data-scene="pending">分析中</button>
      <button data-scene="second">下一段建议</button>
      <button data-scene="failed">带教失败</button>
      <button data-scene="unsupported">模型仅支持文本</button>
    </div>
    <div class="scene">
      <div class="menubar"><strong>示例 macOS 桌面</strong><span>21:41　◉</span></div>
      <div class="window calendar">
        <div class="window-bar"><div class="lights"><i></i><i></i><i></i></div>日历</div>
        <div class="body"><strong>本周安排</strong>产品讨论 · 周二 10:00<div class="line"></div><div class="line short"></div></div>
      </div>
      <div class="window notes">
        <div class="window-bar"><div class="lights"><i></i><i></i><i></i></div>团队笔记 · 普通目标 App</div>
        <div class="body"><h2>本周进展</h2><p>片段 18 的正常转写与润色已经上屏。你可以继续在这里打字；带教建议出现时不会改动文字，也不会主动改变输入焦点。</p>
          <textarea id="editor" aria-label="目标应用输入框">We discussed the launch plan yesterday.</textarea>
          <div class="delivery"><b>✓ 片段 18 已正常上屏</b>　带教是独立支路。</div>
        </div>
      </div>
      <div class="voicebar">语音输入已结束 · 可以继续录下一段</div>
      <div id="coach" aria-live="polite"></div>
    </div>
    <div id="readout" class="readout"></div>
  </main>
  <script>
    // Throwaway UI prototype. No audio, model calls, or persistence.
    const examples = {
      18: { raw: 'We discuss the launch plan yesterday.', natural: 'We discussed the launch plan yesterday.', grammar: '已发生的讨论用过去时 discussed。' },
      19: { raw: 'We can discuss about it next week.', natural: 'We can discuss it next week.', grammar: 'discuss 后直接接宾语，无需 about。' }
    };
    let phase = 'ready';
    let collapsed = false;
    let selectedSegment = 18;
    const coach = document.getElementById('coach');

    function advice() {
      if (phase === 'pending') return '<p class="description">英语带教仍在分析。正常转写、润色和上屏不等它；现在就可以录下一段。</p>';
      if (phase === 'failed') return '<p class="description">这段带教分析失败；已上屏的文字保持原样。</p><div class="note">如果音频仍按隐私设置保留，可从历史单独重试带教。</div>';
      const item = examples[selectedSegment];
      const sample = `<div class="sample"><small>片段 ${selectedSegment} · 原话与建议</small><div class="raw">${item.raw}</div><div class="natural">${item.natural}</div></div>`;
      if (phase === 'unsupported') return `<p class="description">当前模型只支持依据原始转写文本给建议。</p>${sample}<div class="advice"><p><strong>语法</strong> · ${item.grammar}</p></div><div class="note">流利度需要原音频，本场景不评价流利度。数字评分尚未决定。</div>`;
      return `${sample}<div class="advice"><p><strong>语法</strong> · ${item.grammar}</p><p><strong>流利度</strong> · 句尾停顿较长，可把结论连成一句说。<span>依据原音频</span></p></div>`;
    }
    function title() { return phase === 'pending' ? '正在整理建议' : phase === 'failed' ? '带教分析失败' : phase === 'unsupported' ? '文本语法建议' : '建议已就绪'; }
    function tabs() { return phase === 'second' ? `<div class="segment-tabs"><button class="${selectedSegment === 18 ? 'selected' : ''}" data-action="segment18">片段 18</button><button class="${selectedSegment === 19 ? 'selected' : ''}" data-action="segment19">片段 19</button></div>` : ''; }
    function renderCoach() {
      if (phase === 'hidden') { coach.innerHTML = ''; return; }
      if (collapsed) {
        const label = phase === 'pending' ? '带教分析中' : phase === 'second' ? '2 段建议 · 点击展开' : phase === 'failed' ? '带教失败 · 点击查看' : phase === 'unsupported' ? '文本建议 · 点击展开' : '带教建议 · 点击展开';
        coach.innerHTML = `<button class="coach-pill" data-action="expand"><span class="spot"></span>${label}</button>`;
        return;
      }
      coach.innerHTML = `<section class="coach-window" aria-label="英语带教独立悬浮窗"><div class="coach-head"><div><div class="eyebrow">独立带教浮窗 · 片段 ${selectedSegment}</div><h3>${title()}</h3></div><div class="head-actions"><button class="icon-button" data-action="collapse" aria-label="收起浮窗">−</button><button class="icon-button" data-action="close" aria-label="关闭浮窗">×</button></div></div>${tabs()}${advice()}</section>`;
    }
    function render() {
      renderCoach();
      document.getElementById('readout').textContent = `原型状态：${phase}${collapsed ? ' · 已收起' : ''}。带教窗独立于两个示例 App。`;
    }
    function setPhase(next) {
      if (phase === 'hidden') collapsed = false;
      phase = next;
      selectedSegment = next === 'second' ? 19 : 18;
      render();
    }
    document.querySelectorAll('[data-scene]').forEach(button => button.addEventListener('click', () => setPhase(button.dataset.scene)));
    coach.addEventListener('click', event => {
      const action = event.target.closest('[data-action]')?.dataset.action;
      if (action === 'collapse') { collapsed = true; render(); }
      if (action === 'expand') { collapsed = false; render(); }
      if (action === 'close') setPhase('hidden');
      if (action === 'segment18' || action === 'segment19') { selectedSegment = action === 'segment18' ? 18 : 19; render(); }
    });
    render();
  </script>
</body>
</html>
